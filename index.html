<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hospital – Pacientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="./img/logo.png" alt="Hospital Logo">
      <span>Hospital Saúde+</span>
    </div>
    <ul class="navbar-menu">
      <li><a href="#">Pacientes</a></li>
      <li><a href="#">Consultas</a></li>
      <li><a href="#">Equipe</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  </nav>

  </header>

  <main>
    <section id="form-section">
         <br>
            <br>
      <h2>Cadastrar Paciente</h2>
      <form id="patient-form">
        <input type="hidden" id="patient-id">
        <label>
          Nome:
          <input type="text" id="name" required>
        </label>
        <label>
          Idade:
          <input type="text" id="age" min="0" required>
        </label>
        <label>
          CPF:
          <input type="text" id="cpf" maxlength="11" required>
        </label>
        <label>
          Telefone:
          <input type="text" id="phone" maxlength="15" required>
        </label>
        <button type="submit">Salvar</button>
      </form>
    </section>

    <section id="list-section">
      <h2>
        Pacientes Cadastrados
        <button id="toggle-list" type="button">Mostrar</button>
      </h2>
      <div id="list-wrapper" class="hidden">
        <input type="text" id="search" placeholder="Buscar por nome ou CPF...">
        <table>
          <thead>
            <tr>
              <th data-sort="id">ID</th>
              <th data-sort="name">Nome</th>
              <th data-sort="age">Idade</th>
              <th data-sort="cpf">CPF</th>
              <th>Telefone</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="patients-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal de edição -->
  <div id="modal" class="hidden">
    <div class="modal-content">
     
      <form id="edit-form">
        <input type="hidden" id="edit-id">
        <br>
        <label>
          Nome:
          <input type="text" id="edit-name" required>
        </label><br>
        <label>
          Idade:
          <input type="number" id="edit-age" min="0" required>
        </label><br>
        <label>
          CPF:
          <input type="text" id="edit-cpf" maxlength="11" required>
        </label><br>
        <label>
          Telefone:
          <input type="text" id="edit-phone" required>
        </label>
        <br><br>
        <button type="submit">Salvar Alterações</button>
        <button type="button" id="close-modal">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
